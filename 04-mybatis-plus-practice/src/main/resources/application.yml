# 应用配置
server:
  # 后端端口：8084（01 用 8081，02 用 8082，03 用 8083，本专题顺延）
  port: 8084

spring:
  application:
    name: mybatis-plus-practice
  # 强制 UTF-8，避免 Windows 控制台中文乱码
  banner:
    charset: UTF-8
  # H2 内存数据库，启动时自动执行 schema.sql / data.sql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开发环境打印 SQL，方便学习观察
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线转驼峰（H2 表字段是下划线，Java 实体是驼峰）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 全局表名前缀
      table-prefix: t_
      # 全局主键类型：雪花 ID
      id-type: assign_id
      # 全局逻辑删除字段与值
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    # 教学项目：把自己包的日志开到 INFO
    com.example.mp: INFO
