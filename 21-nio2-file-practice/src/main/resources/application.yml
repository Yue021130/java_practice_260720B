# 应用配置
server:
  # 后端端口：8101（前序模块已用到 8100，本专题顺延）
  port: 8101

spring:
  application:
    name: springboot-nio2-file-practice
  # 强制 UTF-8，避免 Windows 控制台中文乱码
  banner:
    charset: UTF-8
  servlet:
    multipart:
      # 文件上传大小限制
      max-file-size: 10MB
      max-request-size: 10MB

nio:
  # 文件操作沙箱目录，所有读写/copy/move/遍历都限制在该目录下
  # 使用相对路径时，会解析为项目根目录下的 nio-work 文件夹
  work-dir: ./nio-work

logging:
  level:
    # 教学项目：把自己包的日志开到 INFO，方便观察文件操作过程
    com.example.nf: INFO
