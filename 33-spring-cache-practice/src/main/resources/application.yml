server:
  port: 8080

spring:
  datasource:
    # MySQL 8.0；建库建表语句见 docs/sql/schema.sql
    url: jdbc:mysql://localhost:3306/scp_db?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 按本机 MySQL 实际 root 密码修改（本机已验证 root/123456 均无法登录，需自行确认）
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    # 本章缓存实战必需：Caffeine 一级 + Redis 二级
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3s
  cache:
    # 关掉 Boot 默认的 CacheAutoConfiguration 选型，改用本章自定义的 TwoLevelCacheManager
    type: none
    two-level:
      # 各 cacheName 的二级缓存 TTL（秒）；空值占位统一用 null-ttl
      configs:
        product: { ttl: 600, jitter: 60 }      # 商品详情
        productPage: { ttl: 120, jitter: 20 }  # 商品分页
        productLock: { ttl: 10, jitter: 0 }    # 防击穿 SETNX 锁
      null-ttl: 30        # 空值占位 TTL（防缓存穿透），远短于正常 TTL
      l1-maximum-size: 1000

# Sa-Token 配置
sa-token:
  token-name: Authorization          # Token 在请求头中的名称
  timeout: 86400                     # Token 有效期（秒），1 天
  is-concurrent: true                # 是否允许同一账号多地登录
  is-log: false                      # 是否输出操作日志
  is-read-header: true               # 从请求头读取 Token（前端 axios 拦截器负责注入）
  jwt-secret-key: scp-secret-key-2026# JWT 签名密钥（生产环境务必改为复杂随机串并放入配置中心）

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台打印 SQL，便于学习观察「缓存命中后 SQL 消失」的效果
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted    # 逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0
