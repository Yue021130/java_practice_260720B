# 应用配置
server:
  # 后端端口：8103（前序模块已用到 8102，本专题顺延）
  port: 8103

spring:
  application:
    name: springboot-easy-excel-practice
  # 强制 UTF-8，避免 Windows 控制台中文乱码
  banner:
    charset: UTF-8
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  level:
    # 教学项目：把自己包的日志开到 INFO，方便观察导入导出过程
    com.example.eep: INFO
